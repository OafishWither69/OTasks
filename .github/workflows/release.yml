name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Install build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check tag and protected branch ancestry
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          VERSION=$(sed -n 's/^otasks.versionName=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: ./gradlew --no-build-cache :domain:test :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug :app:assembleDebug :app:checkVersioning spotlessCheck
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew --no-build-cache :app:connectedDebugAndroidTest
      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/otasks-release.jks"
      - name: Build signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/otasks-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-build-cache :app:assembleRelease
      - name: Verify and publish
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: python3 .github/scripts/publish_release.py
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/otasks-release.jks"
